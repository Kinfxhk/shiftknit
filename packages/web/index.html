<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="ShiftKnit (排更易): free, offline staff rota builder. Every rota is checked rule by rule by an independent checker. Data stays in your browser."
    />
    <meta name="theme-color" content="#1f5f5b" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ShiftKnit · 排更易</title>
  </head>
  <body>
    <a class="skip" href="#rota" data-t="app.skip">Skip to the rota</a>
    <header class="top">
      <div class="brand">
        <img src="./icon.svg" alt="" width="40" height="40" />
        <div>
          <h1>ShiftKnit · 排更易</h1>
          <p data-t="app.tagline">Free, offline staff rota builder.</p>
        </div>
      </div>
      <div class="settings">
        <label
          ><span data-t="settings.lang">Language</span>
          <select id="lang">
            <option value="zh-HK">繁體中文</option>
            <option value="en">English</option>
          </select></label
        >
        <label
          ><span data-t="settings.theme">Theme</span>
          <select id="theme"></select
        ></label>
        <label class="check"
          ><input type="checkbox" id="large" />
          <span data-t="settings.large">Large text</span></label
        >
      </div>
    </header>

    <main>
      <section id="setup" aria-labelledby="setup-title">
        <h2 id="setup-title" data-t="setup.title">1. Set up</h2>
        <div class="toolbar">
          <button type="button" id="new-btn" data-t="setup.new">New project</button>
          <button type="button" id="sample-btn" data-t="setup.sample">Load sample</button>
          <label class="file-btn"
            ><span data-t="setup.import">Open project file</span>
            <input type="file" id="import-file" accept=".json,application/json"
          /></label>
          <button type="button" id="delete-btn" class="danger" data-t="setup.delete">
            Delete all data on this device
          </button>
          <span id="import-msg" role="status"></span>
        </div>
        <div id="setup-errors" class="errors" role="alert" hidden></div>
        <div id="setup-body"></div>
        <datalist id="tz-list">
          <option value="Asia/Hong_Kong"></option>
          <option value="Asia/Macau"></option>
          <option value="Asia/Taipei"></option>
          <option value="Asia/Singapore"></option>
          <option value="Asia/Tokyo"></option>
          <option value="Australia/Sydney"></option>
          <option value="Europe/London"></option>
          <option value="America/New_York"></option>
          <option value="America/Los_Angeles"></option>
          <option value="UTC"></option>
        </datalist>
      </section>

      <section id="rota" aria-labelledby="rota-title" tabindex="-1">
        <h2 id="rota-title" data-t="rota.title">2. Rota</h2>
        <div class="toolbar">
          <label
            ><span data-t="rota.timeLimit">Time limit</span>
            <select id="time-limit">
              <option value="5">5 s</option>
              <option value="15">15 s</option>
              <option value="60">60 s</option>
            </select></label
          >
          <button type="button" id="solve-btn" class="primary" data-t="rota.solve">
            Make rota
          </button>
          <button type="button" id="stop-btn" hidden data-t="rota.stop">Stop</button>
          <button type="button" id="clear-btn" data-t="rota.clear">Clear rota</button>
          <button type="button" id="unlock-btn" data-t="rota.unlock">Unlock all</button>
          <span class="views" role="group">
            <button type="button" id="view-grid" aria-pressed="true" data-t="rota.viewGrid">
              Staff × days
            </button>
            <button type="button" id="view-week" aria-pressed="false" data-t="rota.viewWeek">
              Week calendar
            </button>
          </span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="explain-box" class="explain" aria-live="polite" hidden></div>
        <div id="rota-view"></div>
        <section id="check" class="check-panel" aria-labelledby="check-title">
          <h3 id="check-title" data-t="check.title">Rule check</h3>
          <div id="check-body" aria-live="polite"></div>
        </section>
      </section>

      <section id="export" aria-labelledby="export-title">
        <h2 id="export-title" data-t="export.title">3. Export and print</h2>
        <div class="toolbar">
          <button type="button" id="csv-grid" data-t="export.csvGrid">CSV</button>
          <button type="button" id="csv-list" data-t="export.csvList">CSV</button>
          <button type="button" id="csv-gaps" data-t="export.csvGaps">CSV</button>
          <button type="button" id="json-project" data-t="export.json">Project file</button>
          <button type="button" id="json-rota" data-t="export.rota">Rota</button>
        </div>
        <div class="toolbar">
          <label
            ><span data-t="export.icsFor">Calendar file for</span>
            <select id="ics-staff"></select
          ></label>
          <button type="button" id="ics-btn" data-t="export.ics">Download .ics</button>
        </div>
        <div class="toolbar">
          <button type="button" id="print-team" data-t="export.printTeam">Print team rota</button>
          <button type="button" id="print-staff" data-t="export.printStaff">
            Print per person
          </button>
          <button type="button" id="print-rest" data-t="export.printRest">Print rest days</button>
        </div>
        <p id="export-msg" class="note" role="status"></p>
      </section>
    </main>

    <footer class="bottom">
      <p data-t="footer.privacy">Your data stays in this browser.</p>
      <p data-t="footer.disclaimer">Not legal advice.</p>
      <p data-t="footer.affiliation">Independent project.</p>
      <p>
        <a id="source-link" href="https://github.com/Kinfxhk/shiftknit" data-t="footer.source"
          >Source code</a
        >
        · <span id="app-version">v0.0.0</span> ·
        <a href="https://www.gnu.org/licenses/agpl-3.0.html" data-t="footer.licence"
          >Licence: AGPL-3.0-or-later</a
        >
        (<a href="./licenses/ShiftKnit-LICENSE.txt">LICENSE</a>) ·
        <a href="https://buymeacoffee.com/kinfxhk" data-t="footer.coffee">Buy me a coffee</a>
      </p>
    </footer>
    <div id="print-area" aria-hidden="true"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
