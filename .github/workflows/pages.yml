# SPDX-License-Identifier: AGPL-3.0-or-later
# Publish the static site to GitHub Pages when a release is published (or on demand).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Also allow tags matching `v*` in Settings → Environments → github-pages, because release
# runs deploy from the tag ref and the default policy only allows the main branch.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit, property, oracle and golden tests
        run: npm test

      - name: Build the static site
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
